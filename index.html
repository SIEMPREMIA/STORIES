:root{--br:#614a3e;--brd:#4a372d;--cr:#EBDDC5;--crl:#F6EFE2;--crd:#D9C7A8;--ink:#3a2c25;--mut:#7a665b;--ok:#4f6b3f;--no:#a4472f;--wh:#fffdf9}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--crl);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3,h4{font-family:AntonFT,Impact,sans-serif;font-weight:400;letter-spacing:.03em;text-transform:uppercase;margin:0 0 .4em;color:var(--br)}
h2{font-size:1.7rem}h3{font-size:1.2rem}h4{font-size:1rem;margin:0}
header.top{background:var(--br);color:var(--cr);padding:14px 18px;display:flex;align-items:center;gap:14px}
header.top img{height:46px;width:auto}header.top h1{color:var(--cr);font-size:1.5rem;margin:0}
header.top p{margin:0;font-size:.8rem;opacity:.85;letter-spacing:.1em;text-transform:uppercase}
#tabs{background:var(--cr);border-bottom:2px solid var(--br);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch}
.tab{flex:none;background:none;border:0;padding:13px 16px;font:600 .85rem/1 inherit;font-family:inherit;color:var(--br);text-transform:uppercase;letter-spacing:.08em;cursor:pointer;border-bottom:4px solid transparent}
.tab.on{border-bottom-color:var(--br);background:var(--crl)}
main{max-width:940px;margin:0 auto;padding:18px 16px 60px}
.panel{background:var(--wh);border:1px solid var(--crd);border-radius:6px;padding:18px;margin-bottom:16px}
.lead{color:var(--mut);margin:0 0 14px}.mut{color:var(--mut);font-size:.9rem}
label{display:block;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--br)}
select,input[type=text],input:not([type]),input[type=date],textarea{display:block;width:100%;margin-top:5px;padding:10px 11px;border:1px solid var(--crd);border-radius:4px;background:#fff;color:var(--ink);font:inherit;text-transform:none;letter-spacing:0;font-weight:400}
textarea{resize:vertical}select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.grid2,.grid3{display:grid;gap:14px;margin-bottom:14px}.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}
fieldset{border:1px solid var(--crd);border-radius:4px;margin:0 0 14px;padding:10px 12px}legend{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--br);padding:0 6px}
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rad{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;font-weight:400;font-size:.95rem;color:var(--ink);border:1px solid var(--crd);padding:9px;border-radius:4px;cursor:pointer}
.rad input{margin-top:4px;accent-color:var(--br)}.rad small{display:block;color:var(--mut);font-size:.8rem}
.info{background:var(--cr);border-left:4px solid var(--br);padding:10px 12px;margin-bottom:14px;font-size:.92rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--br);color:var(--cr);border:1px solid var(--br);padding:10px 18px;border-radius:4px;font:600 .85rem inherit;font-family:inherit;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.btn:hover{background:var(--brd)}.btn.ghost{background:transparent;color:var(--br)}.btn.ghost:hover{background:var(--cr)}.btn.big{padding:13px 26px;font-size:.95rem}
.mini{background:transparent;border:1px solid var(--crd);color:var(--br);padding:4px 10px;border-radius:3px;font:.78rem inherit;font-family:inherit;cursor:pointer}.mini:hover{background:var(--cr)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:1px solid var(--br);background:transparent;color:var(--br);padding:7px 14px;border-radius:20px;font:600 .82rem inherit;font-family:inherit;cursor:pointer}.chip.on{background:var(--br);color:var(--cr)}
.seqhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}.seqhead p{margin:0;color:var(--mut)}
.story{display:grid;grid-template-columns:44px 1fr 112px;gap:12px;border-top:1px solid var(--crd);padding:14px 0}
.sn{text-align:center}.sn b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.8rem;color:var(--br);line-height:1}.sn small{font-size:.7rem;color:var(--mut)}
.sb header{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:3px;background:var(--cr);color:var(--br);cursor:help}
.tag.pal{background:transparent;border:1px solid var(--crd);color:var(--mut);cursor:default}
.tag.fA{background:#614a3e;color:#EBDDC5}.tag.fB{background:#a58a74;color:#fff}.tag.fC{background:#EBDDC5}.tag.fD{background:#3a2c25;color:#EBDDC5}
dl{margin:0}dt{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-top:7px}dd{margin:1px 0 0}dd.scr{font-weight:600;color:var(--br)}
.fh{font-size:.8rem;color:var(--mut);margin:8px 0}
.phone{position:relative;width:100%;aspect-ratio:9/16;background:linear-gradient(#a58a74,#614a3e);border-radius:10px;overflow:hidden;align-self:start;border:2px solid var(--br)}
.pgrid i{position:absolute;background:rgba(235,221,197,.35)}.pgrid i:first-child{left:50%;top:0;bottom:0;width:1px}.pgrid i:last-child{top:50%;left:0;right:0;height:1px}
.ptxt{position:absolute;top:10%;left:8%;right:8%;text-align:center;color:#EBDDC5;line-height:1.15;font-size:8px}.ptxt b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:11px}.ptxt span{display:block;margin-top:3px}
.pmed{position:absolute;top:38%;left:12%;right:12%;height:28%;border:1px dashed rgba(235,221,197,.7);color:#EBDDC5;font-size:7px;display:flex;align-items:center;justify-content:center;text-align:center}
.pkw{position:absolute;left:0;right:0;top:44%;text-align:center;color:#EBDDC5;font-family:AntonFT,Impact,sans-serif;font-size:19px;letter-spacing:.05em;background:rgba(58,44,37,.5);padding:3px}
.chk{background:var(--crl);border:1px solid var(--crd);border-radius:4px;padding:8px 12px;margin-bottom:8px}.chk summary{cursor:pointer;font-size:.92rem}
.chk ul,.ctal{list-style:none;padding:0;margin:8px 0 0}.chk li,.ctal li{padding:5px 0;font-size:.9rem}.chk li b,.ctal li b{display:inline-block;min-width:68px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}.chk li.ok b,.ctal li.ok b{color:var(--ok)}.chk li.no b,.ctal li.no b{color:var(--no)}.chk small{display:block;margin-left:72px;color:var(--mut)}
.aviso{background:#fbeee2;border-left:4px solid var(--no);padding:10px 12px;font-size:.9rem}.note{font-size:.85rem;color:var(--mut);margin:10px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{background:var(--cr);border-radius:4px;padding:8px 4px;text-align:center;font-size:.78rem}.day b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;letter-spacing:.05em;color:var(--br);font-size:.95rem}.day.off{background:transparent;border:1px dashed var(--crd);color:var(--mut)}
.dayp summary{cursor:pointer;font-size:1.02rem;padding:2px 0;margin-bottom:6px}.inl{display:flex;align-items:center;gap:8px;margin:0}.inl select{margin:0;width:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.cards ul,.panel ul,.panel ol{padding-left:20px}.cards li{margin-bottom:6px}
.fhd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.fhd h3{margin:0}.tipp{background:var(--cr);padding:8px 12px;border-radius:4px;margin:10px 0 0;font-size:.9rem}
.sit dd ul{margin:2px 0;padding-left:18px}.sit .btn{margin-top:12px}
.gridwrap{display:grid;grid-template-columns:230px 1fr;gap:24px;margin-top:8px}
.gphone{position:relative;width:230px;aspect-ratio:9/16;background:linear-gradient(#a58a74,#614a3e);border:3px solid var(--br);border-radius:16px;overflow:hidden}
.q{position:absolute;width:50%;height:50%;border:1px dashed rgba(235,221,197,.75)}.q i{position:absolute;font-style:normal;font-family:AntonFT,Impact,sans-serif;color:rgba(235,221,197,.6);font-size:1.6rem;top:4px;left:8px}
.q1{left:0;top:0}.q2{right:0;top:0}.q3{left:0;bottom:0}.q4{right:0;bottom:0}
.gm{position:absolute;left:0;right:0;background:rgba(58,44,37,.55)}.gm.top{top:0;height:13%}.gm.bot{bottom:0;height:13%}
.gt{position:absolute;top:15%;left:10%;right:10%;text-align:center;color:#EBDDC5}.gt b{display:block;font-family:AntonFT,Impact,sans-serif;font-weight:400;font-size:1.55rem;line-height:1.1;text-transform:uppercase}.gt span{font-size:.75rem}
.gmed{position:absolute;top:38%;left:12%;right:12%;height:27%;border:1px dashed #EBDDC5;color:#EBDDC5;font-size:.7rem;display:flex;align-items:center;justify-content:center}
.gkw{position:absolute;left:0;right:0;top:45%;text-align:center;font-family:AntonFT,Impact,sans-serif;font-size:2.6rem;color:#EBDDC5;letter-spacing:.06em;text-shadow:3px 3px 0 #3a2c25}
.gb{position:absolute;bottom:15%;left:10%;right:10%;text-align:center;color:#EBDDC5;font-size:.72rem}
.gtxt ul{padding-left:18px}.gtxt li{margin-bottom:6px;font-size:.93rem}
mark{background:#f2d3c4;padding:0 2px;border-radius:2px}mark.medio{background:#f6e7b8}
.rtxt{background:var(--crl);border:1px solid var(--crd);padding:12px;border-radius:4px;margin-bottom:12px}.hits{list-style:none;padding:0!important}.hits li{padding:8px 0;border-top:1px solid var(--crd)}
.lv{font-size:.7rem;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:#f2d3c4}.lv.medio{background:#f6e7b8}.okb{color:var(--ok)}
.gd summary{cursor:pointer;font-family:AntonFT,Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--br);font-size:1.1rem}.gb2{padding-top:10px}
.gl dt{margin-top:8px;color:var(--br)}.gl dd{margin:0}
.gd2 pre{white-space:pre-wrap;background:var(--crl);padding:10px;border-radius:4px;font:.85rem/1.5 inherit}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--br);color:var(--cr);padding:9px 18px;border-radius:4px;opacity:0;transition:.2s;pointer-events:none;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
footer{background:var(--br);color:var(--cr);text-align:center;padding:22px 16px;font-family:AntonFT,Impact,sans-serif;letter-spacing:.2em;text-transform:uppercase}footer small{display:block;font-family:inherit;font-size:.7rem;opacity:.7;margin-top:6px;letter-spacing:.1em}
@media(max-width:700px){.grid2,.grid3,.radios,.cards{grid-template-columns:1fr}.story{grid-template-columns:34px 1fr}.story .phone{display:none}.gridwrap{grid-template-columns:1fr;justify-items:center}.cal{grid-template-columns:repeat(4,1fr)}h2{font-size:1.4rem}header.top img{height:38px}.panel{padding:14px}}
@media print{#tabs,footer,.acts,.mini{display:none}}
label small{text-transform:none;letter-spacing:0;font-weight:400;display:block;margin-top:4px}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lc=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s, cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const noDot=s=>String(s).replace(/[.\s]+$/,"");
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
let R=Math.random;
const pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ls(k,v){try{if(v===undefined){const x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

const norm=t=>t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmtFecha=f=>{if(!f)return"";const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(f);if(!m)return f;const M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];return (+m[3])+" de "+M[+m[2]-1]};

// ===== revisor Meta =====
function scanMeta(text){
  const n=norm(text),hits=[];
  RULES.forEach(r=>{const re=new RegExp(r.re.source,"g");let m;while((m=re.exec(n))){if(!m[0].trim()){re.lastIndex++;continue}hits.push({i:m.index,len:m[0].length,w:text.substr(m.index,m[0].length),t:r.t,alt:r.alt,l:r.l})}});
  return hits.sort((a,b)=>a.i-b.i);
}
function ctaCheck(t){
  const n=norm(t),r={ben:false,pro:false,acc:false,avisos:[]};
  r.ben=/si quieres|quieres|para (que|poder|tener|sentirte|llegar|salir|cuidar|ahorrar|no )|consigue|ahorra|evita|sin (prisas|agobios|complicaciones|perder)|tener |sentirte|llegar a|salir de casa|a gusto|tranquil/.test(n);
  r.pro=/guia|rutina|lista|paso a paso|plantilla|audio|catalogo|checklist|calendario|muestra|seleccion|ideas|reto|novedades|mini guia|video/.test(n);
  r.acc=/(comenta|escribe(me)?|responde|mandame|enviame|dime|contesta)[^.]*\b[A-ZÁÉÍÓÚÑ0-9]{3,}\b/.test(t);
  if(/https?:|www\.|\.com|enlace|link/.test(n))r.avisos.push("Nada de enlaces en la story: usa «comenta la palabra X».");
  if(/si quieres empezar a\b/.test(n))r.avisos.push("Evita «si quieres empezar a…»: atrae a quien no va a comprar. Habla del resultado que busca.");
  CTA_FLOJOS.forEach(([p,m])=>{if(n.includes(p)&&p!=="si quieres empezar a")r.avisos.push("«"+p+"» es flojo. "+m+".")});
  if(/compra|comprar|pide ya|pedido ya|oferta ya/.test(n))r.avisos.push("Evita la venta directa en el CTA: ofrece primero un recurso.");
  r.ok=r.ben&&r.pro&&r.acc&&!r.avisos.length;
  return r;
}

function makeCta(c){
  const s=c.s,kw=c.kw,o=c.obj,B="Si quieres "+lc(noDot(s.deseo));

  if(o==="equipo"){t="Si quieres saber cómo encaja el proyecto en tu día a día\nComenta "+kw;d="Si quieres saber cómo encaja el proyecto en tu día a día, comenta la palabra "+kw+" y te cuento por audio mi experiencia, sin compromiso.";}
  else if(o==="reto"){t="Si quieres sumar un gesto sencillo cada día\nComenta "+kw;d="Si quieres sumar un gesto sencillo cada día durante "+c.dias+" días, comenta la palabra "+kw+" y te apunto al reto con el primer gesto.";}
  else if(o==="oferta"){t="Si quieres ver las novedades sin perder tiempo\nComenta "+kw;d="Si quieres ver las novedades del mes sin perder tiempo, comenta la palabra "+kw+" y te envío la lista con lo que más me ha gustado"+(c.fecha?", válida hasta el "+fmtFecha(c.fecha):"")+".";}
  else {t=B+"\nComenta "+kw;d=B+", comenta la palabra "+kw+" y te envío por mensaje mi mini guía «"+s.n+"».";}

}

// ===== generador de una secuencia =====
function genSeq(f){
  const O=OBJS[f.obj];
  let s=SIT[f.sit]||SIT.noche;
  if(f.obj==="equipo"&&s.grupo!=="Equipo Fam Team")s=SIT.equipo_dia;
  const seed=hash([f.obj,s.id,f.prod,f.tono,f.nivel,f.len,f.kw,f.fecha,f.dias,f.nonce].join("|"));
  R=mulberry(seed);
  let pk=f.prod&&f.prod!=="auto"?f.prod:pick(s.prods);
  if(f.obj==="equipo")pk="equipo";
  const p=PRODS[pk];
  const roles=(O.seq[f.len]||O.seq[5]).slice();
  const ctx={s,p,tono:f.tono,obj:f.obj,kw:f.kw||(KWS[f.obj]||KWS.valor)[0],fecha:f.fecha,dias:+f.dias||7,pasos:0,tips:shuffle(p.tips),hook:pick(s.g),habs:shuffle(HABITOS).slice(0,+f.dias||7)};
  const pool=s.grupo==="Equipo Fam Team"?OBJECIONES.equipo:OBJECIONES.clienta;
  ctx.ob=pick(pool);
  if(O.cta){const k=makeCta(ctx);ctx.ctaT=k.t;ctx.ctaD=k.d}
  const lvl={empiezo:0,suelto:1,pro:2}[f.nivel]||0;
  const out=[];let prev="",aRun=0,unused=null;
  roles.forEach((r,i)=>{
    const D=ROLES[r],b=body(r,ctx);
    let opts=D.pref[lvl].split("");
    if(i===0)opts=opts.filter(x=>x!=="A");
    if(!opts.length)opts=["B"];
    let cand=opts.filter(x=>x!==prev);
    if(!cand.length)cand=(lvl===0?["B","C"]:lvl===1?["B","C","D"]:["A","B","C","D"]).filter(x=>x!==prev&&(i||x!=="A"));
    if(aRun>=2&&cand.some(x=>x!=="A"))cand=cand.filter(x=>x!=="A");
    const fm=cand[Math.floor(R()*Math.min(cand.length,2))]||cand[0];
    aRun=fm==="A"?aRun+1:0;prev=fm;
    out.push({rol:r,rolN:D.n,fmt:fm,t:b.t,g:b.g,d:b.d,st:b.st,dur:D.dur,pal:D.pal,zona:D.zona});
  });
  out[0].pal="Primera semana";
  if(!out.some(x=>x.pal==="Respuestas")){const L=out[out.length-1];L.pal="Respuestas";L.d+=" Termina invitando a que te cuenten su experiencia por mensaje.";L.st=L.st==="Ninguno"?"Caja de preguntas (opcional)":L.st}
  return {f:Object.assign({},f),obj:O,sit:s,prod:p,pk,ctx,stories:out,hook:ctx.hook,kw:ctx.kw};
}

// ===== revisión de calidad del curso (sobre una secuencia generada) =====
function checkSeq(res){
  const st=res.stories,O=res.obj,ch=[];
  const add=(ok,t,h)=>ch.push({ok,t,h:h||""});
  add(["B","C"].includes(st[0].fmt)&&st[0].rol!=="cta","La primera story es visual y no vende","La primera story siempre es visual o de lifestyle; nunca vende.");
  let rep=false;for(let i=1;i<st.length;i++)if(st[i].fmt===st[i-1].fmt&&st[i].fmt!=="D")rep=true;
  add(!rep,"No se repite el mismo formato dos veces seguidas","Mezcla A, B, C y D para que la gente no se aburra.");
  let mx=0,run=0;st.forEach(x=>{run=x.rol==="paso"?run+1:0;mx=Math.max(mx,run)});
  add(mx<=3,"El tutorial no pasa de 3 stories seguidas","Más de 3 pasos seguidos y se pierde la gente.");
  const pals=new Set(st.map(x=>x.pal));
  ["Retención","Respuestas","Primera semana"].forEach(pl=>add(pals.has(pl),"Palanca: "+pl.toLowerCase()+" cubierta","Cada secuencia debería trabajar las tres palancas."));
  add(st.length>=3&&st.length<=8,"Longitud entre 3 y 8 stories","Entre 3 y 8. Con 3 tienes la versión mínima; con 4 a 5 es lo más completo para empezar.");
  let a2=0;st.forEach((x,i)=>{if(x.fmt==="A"&&i&&st[i-1].fmt==="A"&&i>1&&st[i-2].fmt==="A")a2++});
  add(a2===0,"No hay tres vídeos a cámara seguidos","Máximo dos vídeos a cámara seguidos.");
  if(O.cta){const cta=st.find(x=>x.rol==="cta");const r=ctaCheck(res.ctx.ctaD);add(r.ok,"El CTA tiene beneficio, promesa concreta y acción","Beneficio tangible + promesa concreta del recurso + acción específica (la palabra clave).");add(st[st.length-1].rol==="cta","El CTA va al final, no al principio","El CTA cierra la secuencia.")}
  else add(!st.some(x=>x.rol==="cta"),"Esta secuencia no lleva CTA, como indica el curso","Demostrar, romper objeción y conectar no llevan CTA.");
  const txt=st.map(x=>x.t+" "+x.d).join(" ");
  add(scanMeta(txt).filter(h=>h.l==="alto").length===0,"Sin frases de riesgo para las políticas de Meta","Revisa en la pestaña Revisor.");
  return ch;
}

}

  +'<div class="gtxt"><h3>Cómo se usa</h3><ul><li><b>Arriba:</b> el gancho, grande, y debajo una explicación corta. Nunca pongas el gancho abajo.</li><li><b>En medio:</b> la prueba gráfica (captura, foto o vídeo). Nunca por encima del texto.</li><li><b>Abajo:</b> contexto, solo si es esencial.</li><li><b>CTA:</b> el beneficio arriba y la palabra clave en letra mucho más grande que el resto.</li><li><b>Aire:</b> no saturar. Un mensaje por story.</li><li><b>Márgenes:</b> nada pegado a los bordes y no tapes tu cara.</li><li><b>Alineación:</b> centrada. Nunca justificada. Izquierda o derecha solo en el medio y a veces; nunca en el gancho ni en el CTA.</li></ul></div></div></section>';
  h+='<section class="panel"><h3>Texto y color</h3><ul><li><b>Máximo 2 tipografías</b> de las que trae Instagram: una principal (70%) y una secundaria (30%).</li><li><b>Contraste:</b> el texto debe leerse al primer vistazo sobre la foto.</li><li><b>Truco de la sombra:</b> duplica la palabra clave, pon una copia detrás en otro color y desplázala un poco.</li><li><b>Colores:</b> usa la paleta de marca (marrón y crema). Evita amarillo, naranja, morado y verde chillones.</li><li><b>Solo la palabra clave</b> va grande; el resto, en tamaño normal.</li><li><b>No pongas subtítulos</b> ni el sticker de enlace: usa «comenta la palabra X».</li></ul></section>';
  h+='<section class="panel"><h3>Medidas</h3><p class="mut">El curso no da medidas en píxeles. Lo siguiente es una recomendación general de Instagram, no del curso:</p><ul><li>Formato vertical 9:16 (1080 × 1920 px).</li><li>Deja libres unos 250 px arriba y abajo, donde Instagram pone su propia interfaz.</li><li>Mantén los textos importantes dentro del 80% central de la pantalla.</li></ul></section>';
  return h;
}

// ===== pestaña REVISOR =====
function viewRevisor(){
  const t=S.rv||"",m=S.rtab||"meta";
  let h='<section class="panel"><h2>Revisor de textos</h2><p class="lead">Pega aquí el texto de tus stories antes de publicarlas. Se revisan dos cosas: las normas de Meta, que penalizan ciertas frases en negocios de venta directa, y la calidad del texto según el curso.</p><textarea id="rv_t" rows="7" placeholder="Pega tu guion o tu CTA">'+esc(t)+'</textarea><div class="chips"><button class="chip'+(m==="meta"?" on":"")+'" data-rt="meta">Políticas de Meta</button><button class="chip'+(m==="cur"?" on":"")+'" data-rt="cur">Calidad del curso</button><button class="chip'+(m==="cta"?" on":"")+'" data-rt="cta">Revisar un CTA</button></div></section>';
  h+='<section class="panel" id="rv_out">'+revOut(t,m)+'</section>';
  return h;
}
function revOut(t,m){
  if(!t.trim())return '<p class="mut">Pega un texto para revisarlo.</p>';
  if(m==="meta"){
    const hits=scanMeta(t);if(!hits.length)return '<p class="okb"><b>Sin avisos.</b> No he encontrado frases de riesgo. Aun así, lee el texto una vez más con calma.</p>';
    let o="",pos=0;hits.forEach(h=>{if(h.i<pos)return;o+=esc(t.slice(pos,h.i))+'<mark class="'+h.l+'">'+esc(t.substr(h.i,h.len))+'</mark>';pos=h.i+h.len});o+=esc(t.slice(pos));
    const uniq={};hits.forEach(h=>{uniq[h.t]=h});
    return '<div class="rtxt">'+o.replace(/\n/g,"<br>")+'</div><ul class="hits">'+Object.values(uniq).map(h=>'<li><b>'+esc(h.t)+'</b> <span class="lv '+h.l+'">'+(h.l==="alto"?"Riesgo alto":"Riesgo medio")+'</span><br><small>Prueba con: '+esc(h.alt)+'</small></li>').join("")+'</ul>';
  }
  if(m==="cta"){
    const r=ctaCheck(t);
    return '<ul class="ctal"><li class="'+(r.ben?"ok":"no")+'"><b>Beneficio</b> '+(r.ben?"Hay un beneficio claro.":"Falta: di qué consigue la persona (su resultado o su alivio).")+'</li><li class="'+(r.pro?"ok":"no")+'"><b>Promesa</b> '+(r.pro?"Dices qué recibe.":"Falta: di exactamente qué recurso va a recibir (guía, lista, audio…).")+'</li><li class="'+(r.acc?"ok":"no")+'"><b>Acción</b> '+(r.acc?"Hay una acción y una palabra clave.":"Falta: «comenta la palabra X» con la palabra en mayúsculas.")+'</li></ul>'+(r.avisos.length?'<ul class="hits">'+r.avisos.map(a=>'<li>'+esc(a)+'</li>').join("")+'</ul>':'');
  }
  const ch=[],words=t.trim().split(/\s+/).length;
  ch.push([words<=25,"Longitud","Entre 15 y 25 palabras por story. Tu texto tiene "+words+"."]);
  ch.push([!/https?:|www\.|enlace|link/i.test(t),"Sin enlaces","Usa «comenta la palabra X» en vez de enlaces."]);
  ch.push([!/dale like|si quieres empezar a|te paso un loom/i.test(t),"Sin CTA flojos","Evita «dale like» o «si quieres empezar a…»."]);
  ch.push([!/solo hoy|ultima hora|ultimas plazas|corre\b|urgente/i.test(norm(t)),"Sin urgencia falsa","Si hay fecha límite, que sea real."]);
  ch.push([!/subtitul/i.test(t),"Sin subtítulos","El curso recomienda no usar subtítulos automáticos."]);
  return '<ul class="ctal">'+ch.map(c=>'<li class="'+(c[0]?"ok":"no")+'"><b>'+c[1]+'</b> '+(c[0]?"Correcto.":esc(c[2]))+'</li>').join("")+'</ul>';
}

// ===== pestaña GUÍA =====
function viewGuia(){
  const D=(t,b)=>'<details class="panel gd"><summary>'+t+'</summary><div class="gb2">'+b+'</div></details>';
  let h='<section class="panel"><h2>Guía del método</h2><p class="lead">Lo esencial del método aplicado a Farmasi y a Fam Team. Si empiezas, lee las tres primeras.</p></section>';
  h+=D("Reels atraen, stories convierten","<p>Los <b>reels</b> hacen que te descubran seguidores. Las <b>stories</b> convierten a una seguidora en clienta. Por eso las stories no son para entretener sin más: cada secuencia tiene un objetivo.</p>");
  h+=D("Las 5 preguntas antes de grabar","<ol><li>¿A quién me dirijo? A tu clienta ideal, no a todo el mundo.</li><li>¿Qué dolor ataco? Un solo problema por secuencia.</li><li>¿Qué valor aporto? Algo que pueda aplicar hoy.</li><li>¿Estoy generando autoridad? Se nota que sabes del tema.</li><li>¿Qué nivel de conciencia uso? ¿Sabe que tiene el problema? ¿Conoce la solución?</li></ol>");
  h+=D("Estructura de una secuencia","<p>Una secuencia no es una story suelta: son de 3 a 8 stories con un hilo (3 es la versión corta, perfecta para empezar). El orden más seguro es: <b>gancho</b> (el dolor y la situación deseada), <b>tutorial</b> (máximo 3 stories), <b>prueba social</b> y <b>CTA</b> con palabra clave, nunca con enlace. Cada story dura entre 7 y 15 segundos, hasta 20 como mucho. Máximo dos vídeos a cámara seguidos.</p>");
  h+=D("Los cuatro tipos de secuencia","<ul>"+["valor","producto","objecion","lifestyle"].map(k=>'<li><b>'+OBJS[k].tipo+': '+OBJS[k].corto+'.</b> '+esc(OBJS[k].que)+'</li>').join("")+"</ul>");
  h+=D("Las tres palancas","<ul><li><b>Retención:</b> que la gente vea tus stories hasta el final. Lo consigues con gancho, hilo y curiosidad.</li><li><b>Respuestas:</b> que te contesten por mensaje. Una respuesta vale más que una encuesta.</li><li><b>Primera semana:</b> los nuevos seguidores tienen siete días en los que ven más tus stories. Aprovecha con una primera story visual y cercana.</li></ul><p>Una cuenta normal ve sus stories entre el 5% y el 10% de sus seguidores. Si tu secuencia es buena, ese número sube.</p>");
  h+=D("El CTA que funciona","<p>Fórmula del curso: <b>beneficio tangible</b> (lo que la persona consigue) + <b>promesa concreta</b> del recurso + <b>acción específica</b> (una palabra clave).</p><p>Ejemplo flojo: «te paso una guía». Ejemplo bueno: «si quieres tener una rutina de cinco minutos que sí hagas cada noche, comenta la palabra RUTINA y te envío mi mini guía».</p><p>Hay tres tipos de CTA: de crecimiento, de engagement (inútil por sí solo) y de captación, que es el que usamos.</p>");
  h+=D("Plan semanal","<ul><li>Lunes y miércoles: valor con CTA.</li><li>Martes y viernes: producto, caso de éxito o autoridad.</li><li>Jueves: romper objeción.</li><li>Sábado: descanso.</li><li>Domingo: lifestyle con intención.</li></ul><p>Empieza con 3 o 4 secuencias por semana. El primer mes, un CTA de captación por semana. Máximo 2 CTA y una venta directa por semana, y nunca dos CTA el mismo día. Planifica el mes, graba el lunes y publica entre las 11:00 y las 14:00.</p>");
  h+=D("Reglas de oro para Farmasi (Meta)","<ul><li>Nada de dinero, ingresos, comisiones ni capturas de pagos.</li><li>Nada de pérdida de peso, antes y después de cuerpo, ni promesas de salud.</li><li>Un complemento no sustituye una alimentación variada.</li><li>Urgencia solo si es real, con fecha verdadera.</li><li>Un caso de éxito, solo con permiso escrito de la clienta.</li><li>Sin números ni comparaciones de cuerpo.</li></ul>");
  h+=D("Glosario para empezar","<dl class='gl'>"+[["Story","Foto o vídeo que dura 24 horas en Instagram."],["Secuencia","Varias stories seguidas que cuentan una sola idea."],["Gancho","La primera frase o imagen: lo que hace que no pasen de largo."],["CTA","Llamada a la acción: lo que le pides hacer a quien te ve."],["Palabra clave","Una palabra que la persona comenta para recibir el recurso."],["ManyChat","Herramienta que envía automáticamente el mensaje cuando alguien comenta la palabra clave."],["Hilo","El tema común que une todas tus stories de la semana."],["Retención","Cuánta gente sigue viendo tu secuencia hasta el final."],["Prueba social","Mensajes o experiencias de otras personas que demuestran que lo que cuentas es real."],["POV","Vídeo en primera persona, como si la persona viera lo que tú ves."],["Detrás de cámaras","Mostrar cómo es tu día o cómo preparas algo, sin guion."],["Lifestyle","Contenido de tu vida diaria con una intención detrás."],["Objeción","Una duda que impide comprar: «es caro», «no tengo tiempo»."],["Recurso","El contenido que regalas a cambio de la palabra clave: una guía, una lista, un audio."],["Cliente ideal","La persona a la que quieres ayudar. Para quien hablas."]].map(g=>'<dt>'+g[0]+'</dt><dd>'+g[1]+'</dd>').join("")+"</dl>");
  return h;
}

// ===== pestaña PERFIL =====
function viewPerfil(){
  const P=ls("ft_perfil")||{},G=ls("ft_guiones")||[];
  let h='<section class="panel"><h2>Tu perfil</h2><div class="grid3"><label>Tu nombre<input id="p_nombre" value="'+esc(P.nombre||"")+'"></label><label>Tu usuario<input id="p_user" value="'+esc(P.user||"")+'" placeholder="@tuusuario"></label><label>Tu nivel'+sel("p_nivel",[["empiezo","Empiezo hoy"],["suelto","Me suelto"],["pro","Ya publico a diario"]],P.nivel||S.f.nivel)+'</label><label>Tono habitual'+sel("p_tono",Object.keys(TONOS).map(k=>[k,TONOS[k].n]),P.tono||S.f.tono)+'</label></div><div class="acts"><button class="btn" data-act="psave">Guardar perfil</button></div><p class="note">Todo se guarda solo en este navegador y no se envía a ninguna parte.</p></section>';
  h+='<section class="panel"><h3>Mis guiones guardados</h3>'+(G.length?G.map((g,i)=>'<details class="gd2"><summary><b>'+esc(g.titulo)+'</b> <small>'+esc(g.fecha)+'</small></summary><pre>'+esc(g.texto)+'</pre><button class="mini" data-gcopy="'+i+'">Copiar</button> <button class="mini" data-gdel="'+i+'">Quitar</button></details>').join(""):'<p class="mut">Todavía no has guardado ninguno. Genera una secuencia y pulsa «Guardar».</p>')+'</section>';
  return h;
}

// ===== render y eventos =====
const VIEWS={crear:viewCrear,semana:viewSemana,situaciones:viewSituaciones,ganchos:viewGanchos,formatos:viewFormatos,cuadricula:viewCuadricula,revisor:viewRevisor,guia:viewGuia,perfil:viewPerfil};
function render(keep){
  const y=window.scrollY;
  $("#tabs").innerHTML=TABS.map(t=>'<button class="tab'+(S.tab===t[0]?" on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join("");
  $("#main").innerHTML=VIEWS[S.tab]();
  if(keep)window.scrollTo(0,y);else window.scrollTo(0,0);
}
function saveSeq(res){
  const G=ls("ft_guiones")||[];G.unshift({titulo:res.obj.corto+" · "+res.sit.n,fecha:new Date().toLocaleDateString("es-ES"),texto:scriptText(res)});
  ls("ft_guiones",G.slice(0,40));toast("Guardado en tu perfil");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-tab]");if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;render();return}
  if(d.copy){copy(d.copy);return}
  if(d.grp){S.gtab=d.grp;render(true);return}
  if(d.gz){S.gz=d.gz;render(true);return}
  if(d.rt){S.rtab=d.rt;const x=$("#rv_t");S.rv=x?x.value:S.rv;render(true);return}
  if(d.use){readCrear();S.f.sit=d.use;S.res=null;S.tab="crear";render();return}
  if(d.gcopy){copy((ls("ft_guiones")||[])[+d.gcopy].texto);return}
  if(d.gdel){const G=ls("ft_guiones")||[];G.splice(+d.gdel,1);ls("ft_guiones",G);render(true);return}
  switch(d.act){
   case "gen":readCrear();S.f.nonce=0;S.res=genSeq(S.f);render();setTimeout(()=>{const o=$("#out");if(o)o.scrollIntoView({behavior:"smooth",block:"start"})},50);break;
   case "regen":S.f.nonce++;S.res=genSeq(S.f);render(true);break;
   case "copyseq":copy(scriptText(S.res));break;
   case "saveseq":saveSeq(S.res);break;
   case "wgen":S.w.nonce+=10;buildWeek();render(true);break;
   case "wday":S.week[+d.i].nonce+=7;render(true);break;
   case "wsave":saveSeq(S.week[+d.i].res);break;
   case "wcopy":copy(S.week.map(x=>x.dia.toUpperCase()+"\n"+scriptText(x.res)).join("\n\n========\n\n"));break;
   case "psave":{const p={nombre:$("#p_nombre").value,user:$("#p_user").value,nivel:$("#p_nivel").value,tono:$("#p_tono").value};ls("ft_perfil",p);S.f.nivel=p.nivel;S.f.tono=p.tono;S.f.len=defLen(p.nivel);toast("Perfil guardado");break}
  }
});
document.addEventListener("change",e=>{
  const id=e.target.id||"";
  if(id==="f_obj"){readCrear();S.f.kw="";if(S.f.obj==="equipo")S.f.sit="equipo_dia";S.res=null;render(true)}
  else if(id==="f_sit"||id==="f_prod"||id==="f_tono"||id==="f_len"||id==="f_kw"||id==="f_fecha"||id==="f_dias"){readCrear()}
  else if(e.target.name==="f_nivel"){readCrear();S.f.len=defLen(S.f.nivel);render(true)}
  else if(id==="w_plan"||id==="w_sit"||id==="w_extra"){S.w[id.slice(2)]=e.target.value;buildWeek();render(true)}
  else if(id.startsWith("wd_")){S.week[+id.slice(3)].obj=e.target.value;render(true)}
});
document.addEventListener("input",e=>{
  if(e.target.id==="g_x"){S.gx=e.target.value;const p=e.target.selectionStart;render(true);const n=$("#g_x");n.focus();n.setSelectionRange(p,p)}
  else if(e.target.id==="rv_t"){S.rv=e.target.value;$("#rv_out").innerHTML=revOut(S.rv,S.rtab||"meta")}
});
S.f.len=defLen(S.f.nivel);
try{render()}catch(err){$('#main').innerHTML='<section class="panel"><h3>Error</h3><p>'+esc(err&&err.message)+'</p></section>'}

</script></body></html>
